<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>R-35 · C-01 轮端材质可读性（加载中）</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef3f8; overflow: hidden;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #23262b; }
  #stage { width: 1280px; height: 800px; }
  #gl { display: block; width: 1280px; height: 800px; }
  .hud { position: fixed; left: 14px; top: 12px; max-width: 700px; padding: 8px 12px;
    border-radius: 8px; background: rgba(255,255,255,.94); border: 1px solid #d9d6cf;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .hud b { letter-spacing: .04em; }
  .hud .vars { margin-top: 2px; color: #59616b; font-variant-numeric: tabular-nums; }
  .hud .note { margin-top: 4px; color: #8a6d3b; font-size: 12px; }
  #out, #shots { position: fixed; left: -99999px; top: 0; }
  body.clean .hud { display: none; }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl" width="1280" height="800" aria-label="R-35 C-01 轮端材质可读性"></canvas></div>
  <div class="hud" id="hud">
    <b>CARLAB · R-35 C-01 轮端材质可读性</b>
    <div class="vars">机位 full / bearingIsolated / hubStack · 两臂 A=0.70/0.34/1.05，B=GLB 原生 · 1280×800</div>
    <div class="note">隔离实验：直接实例化生产 EngineeringViewport 加载 C-01 已验收 GLB；未修改 workbench-v2 与 C-01 包。样板材质为 DEMO_ASSUMPTION。</div>
  </div>
  <pre id="out"></pre>
  <pre id="shots"></pre>
  <script type="module">
    const q = new URLSearchParams(location.search);
    if (q.get('clean') === '1') document.body.classList.add('clean');
    window.addEventListener('error', (e) => {
      const out = document.getElementById('out');
      out.textContent = '__R35_JSON_BEGIN__' + JSON.stringify({ error: '模块加载/运行错误：' + (e.message || 'unknown') }) + '__R35_JSON_END__';
    });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
