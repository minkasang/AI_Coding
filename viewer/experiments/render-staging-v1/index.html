<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>R-24 · V2 轮端 PBR 小步试验（加载中）</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef3f8; overflow: hidden;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #23262b; }
  #stage { width: 1280px; height: 800px; }
  #canvas { display: block; width: 1280px; height: 800px; }
  .hud { position: fixed; left: 14px; top: 12px; max-width: 620px; padding: 8px 12px;
    border-radius: 8px; background: rgba(255,255,255,.92); border: 1px solid #d9d6cf;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .hud b { letter-spacing: .04em; }
  .hud .vars { margin-top: 2px; color: #59616b; font-variant-numeric: tabular-nums; }
  .hud .links { margin-top: 6px; font-size: 12px; }
  .hud .links a { color: #2364bd; margin-right: 10px; white-space: nowrap; }
  .hud .note { margin-top: 4px; color: #8a6d3b; font-size: 12px; }
  #metrics { position: fixed; left: -99999px; top: 0; }
  body.clean .hud { display: none; }
  #err { position: fixed; left: 14px; bottom: 14px; max-width: 900px; padding: 10px 14px;
    background: #fff2f0; border: 1px solid #e5b4ad; border-radius: 8px; color: #7a2318; white-space: pre-wrap; }
  #err[hidden] { display: none; }
</style>
</head>
<body>
  <div id="stage"><canvas id="canvas" width="1280" height="800" aria-label="R-24 V2 轮端 PBR 固定机位 A/B"></canvas></div>
  <div class="hud" id="hud">
    <b>CARLAB · R-24 小步可验证画质试验</b>
    <div class="vars" id="vars">loading…</div>
    <div class="links" id="links"></div>
    <div class="note">隔离实验页：直接实例化生产 EngineeringViewport，未修改 workbench-v2/viewport.js；所有候选值均为 VISUAL_ASSUMPTION。</div>
  </div>
  <pre id="metrics"></pre>
  <div id="err" hidden></div>
  <script type="module">
    const q = new URLSearchParams(location.search);
    if (q.get('clean') === '1') document.body.classList.add('clean');
    const keys = ['m', 'g', 'h', 's'];
    const active = q.get('all') === '1' ? 'all(组合反例)' : (keys.filter(k => q.get(k) === '1').join('+') || 'b(基线)');
    document.getElementById('vars').textContent =
      `配置 ${active} · 场景 single / explode / clip · 视角 iso + side · 1280×800 · 同一 5173 GLB`;
    const presets = ['', '?m=1', '?g=1', '?h=1', '?s=1', '?all=1'];
    document.getElementById('links').innerHTML = presets.map((p, i) =>
      `<a href="${location.pathname}${p}">${['b 基线', 'M 材质', 'G 地面', 'H 填光', 'S 主光', 'all 反例'][i]}</a>`).join('');
    window.addEventListener('error', (e) => {
      const el = document.getElementById('err');
      el.hidden = false;
      el.textContent = '模块加载/运行错误：' + (e.message || e.error || 'unknown');
    });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
